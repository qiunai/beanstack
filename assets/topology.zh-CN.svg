<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="512" viewBox="0 0 1280 512" role="img" aria-labelledby="t d" xml:lang="zh-CN">
  <title id="t">BeanStack 派工拓扑</title>
  <desc id="d">主协调器（Opus medium）把任务派给六个宿主子代理（侦察 Haiku high、执行 Sonnet high，核心执行、设计、复核 Opus medium，验证 Sonnet high），也派给装了就自动识别的外部通道：Codex（GPT Sol / Astra）、Grok、经 agy 的 Gemini、Cursor、Devin 和 Claude API。通道缺失或启动失败时，回落到该角色的宿主子代理。</desc>
  <defs>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.045"/>
    </filter>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1.5 1.2 L7 4 L1.5 6.8" fill="none" stroke="#a3a29d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, 'Inter Tight', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', system-ui, -apple-system, 'Segoe UI', sans-serif; font-feature-settings: 'cv11', 'ss01'; }
    .t-ink { fill: #141414; }
    .t-sub { fill: #5a5955; }
    .t-faint { fill: #8a8984; }
    .wire { fill: none; stroke: #a3a29d; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
    .dash { stroke-dasharray: 3 4; }
    .ico { fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect x="0" y="0" width="1280" height="512" rx="24" fill="#f5f5f3"/>
<g><rect x="40" y="40" width="368" height="404" rx="20" fill="#ffffff" filter="url(#lift)"/><rect x="40.5" y="40.5" width="367" height="403" rx="19.5" fill="none" stroke="rgba(0,0,0,0.06)"/><text x="64" y="151" font-size="15" font-weight="600" letter-spacing="0" class="t-ink">侦察</text><text x="384" y="150.5" text-anchor="end" font-size="13" class="t-sub">Haiku high</text><line x1="64" y1="172.5" x2="384" y2="172.5" stroke="#ecebe8"/><text x="64" y="203" font-size="15" font-weight="600" letter-spacing="0" class="t-ink">执行</text><text x="384" y="202.5" text-anchor="end" font-size="13" class="t-sub">Sonnet high</text><line x1="64" y1="224.5" x2="384" y2="224.5" stroke="#ecebe8"/><text x="64" y="255" font-size="15" font-weight="600" letter-spacing="0" class="t-ink">核心执行</text><text x="384" y="254.5" text-anchor="end" font-size="13" class="t-sub">Opus medium</text><line x1="64" y1="276.5" x2="384" y2="276.5" stroke="#ecebe8"/><text x="64" y="307" font-size="15" font-weight="600" letter-spacing="0" class="t-ink">设计</text><text x="384" y="306.5" text-anchor="end" font-size="13" class="t-sub">Opus medium</text><line x1="64" y1="328.5" x2="384" y2="328.5" stroke="#ecebe8"/><text x="64" y="359" font-size="15" font-weight="600" letter-spacing="0" class="t-ink">复核</text><text x="384" y="358.5" text-anchor="end" font-size="13" class="t-sub">Opus medium</text><line x1="64" y1="380.5" x2="384" y2="380.5" stroke="#ecebe8"/><text x="64" y="411" font-size="15" font-weight="600" letter-spacing="0" class="t-ink">验证</text><text x="384" y="410.5" text-anchor="end" font-size="13" class="t-sub">Sonnet high</text><text x="64" y="78" font-size="16" font-weight="600" letter-spacing="0" class="t-ink">宿主子代理</text><text x="64" y="100" font-size="12.5" class="t-sub">只有一个 Agent 也能完整使用</text></g>
<g><rect x="872.5" y="40.5" width="367" height="403" rx="20" fill="none" stroke="rgba(0,0,0,0.16)" stroke-dasharray="4 4"/><text x="896" y="151" font-size="15" font-weight="600" letter-spacing="0" class="t-ink">Codex</text><text x="1216" y="150.5" text-anchor="end" font-size="13" class="t-sub">GPT Sol / Astra</text><line x1="896" y1="172.5" x2="1216" y2="172.5" stroke="rgba(0,0,0,0.07)"/><text x="896" y="203" font-size="15" font-weight="600" letter-spacing="0" class="t-ink">Grok</text><text x="1216" y="202.5" text-anchor="end" font-size="13" class="t-sub">Grok 4.7，查资料</text><line x1="896" y1="224.5" x2="1216" y2="224.5" stroke="rgba(0,0,0,0.07)"/><text x="896" y="255" font-size="15" font-weight="600" letter-spacing="0" class="t-ink">Gemini</text><text x="1216" y="254.5" text-anchor="end" font-size="13" class="t-sub">Neon、Hydrogen，经 agy</text><line x1="896" y1="276.5" x2="1216" y2="276.5" stroke="rgba(0,0,0,0.07)"/><text x="896" y="307" font-size="15" font-weight="600" letter-spacing="0" class="t-ink">Cursor</text><text x="1216" y="306.5" text-anchor="end" font-size="13" class="t-sub">Cursor agent</text><line x1="896" y1="328.5" x2="1216" y2="328.5" stroke="rgba(0,0,0,0.07)"/><text x="896" y="359" font-size="15" font-weight="600" letter-spacing="0" class="t-ink">Devin</text><line x1="896" y1="380.5" x2="1216" y2="380.5" stroke="rgba(0,0,0,0.07)"/><text x="896" y="411" font-size="15" font-weight="600" letter-spacing="0" class="t-ink">Claude API</text><text x="1216" y="410.5" text-anchor="end" font-size="13" class="t-sub">用户指定时启用</text><text x="896" y="78" font-size="16" font-weight="600" letter-spacing="0" class="t-ink">外部通道</text><text x="896" y="100" font-size="12.5" class="t-sub">装了就自动识别</text></g>
<g><rect x="522" y="201" width="236" height="150" rx="22" fill="#ffffff" filter="url(#lift)"/><rect x="522.5" y="201.5" width="235" height="149" rx="21.5" fill="none" stroke="rgba(0,0,0,0.06)"/><circle cx="640" cy="229" r="4" fill="#13a36b"/><text x="640" y="265" text-anchor="middle" class="t-ink" font-size="21" font-weight="700" letter-spacing="0">主协调器</text><text x="640" y="289" text-anchor="middle" font-size="13" font-weight="600" fill="#13a36b">Opus medium</text><line x1="550" y1="305.5" x2="730" y2="305.5" stroke="#ecebe8"/><text x="640" y="329" text-anchor="middle" class="t-sub" font-size="12.5">规划、裁决、管 Git</text></g>
<g><path class="wire" d="M518 276 H444"/><path class="wire" d="M444 156 V396"/><path class="wire" d="M444 156 Q444 146 434 146 H414" marker-end="url(#a)"/><path class="wire" d="M444 198 H414" marker-end="url(#a)"/><path class="wire" d="M444 250 H414" marker-end="url(#a)"/><path class="wire" d="M444 302 H414" marker-end="url(#a)"/><path class="wire" d="M444 354 H414" marker-end="url(#a)"/><path class="wire" d="M444 396 Q444 406 434 406 H414" marker-end="url(#a)"/><path class="wire dash" d="M762 276 H836"/><path class="wire dash" d="M836 156 V396"/><path class="wire dash" d="M836 156 Q836 146 846 146 H866" marker-end="url(#a)"/><path class="wire dash" d="M836 198 H866" marker-end="url(#a)"/><path class="wire dash" d="M836 250 H866" marker-end="url(#a)"/><path class="wire dash" d="M836 302 H866" marker-end="url(#a)"/><path class="wire dash" d="M836 354 H866" marker-end="url(#a)"/><path class="wire dash" d="M836 396 Q836 406 846 406 H866" marker-end="url(#a)"/></g>
<path class="wire dash" d="M1056 450 V468 Q1056 478 1046 478 H234 Q224 478 224 468 V450" marker-end="url(#a)"/><rect x="476" y="466" width="328" height="24" fill="#f5f5f3"/><text x="640" y="482.5" text-anchor="middle" font-size="12.5" class="t-sub">通道缺失或启动失败时，回落到该角色的宿主子代理</text>
</svg>
