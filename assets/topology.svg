<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="512" viewBox="0 0 1280 512" role="img" aria-labelledby="t d">
  <title id="t">BeanStack dispatch topology</title>
  <desc id="d">A Coordinator session on Opus medium dispatches to six host subagents (Scout on Haiku high, Exec on Sonnet high, Core, Design and Review on Opus medium, Verify on Sonnet high) and to external CLIs that are auto-detected if installed: Codex with GPT Sol or Astra, Grok, Gemini via agy, Cursor, Devin and the Claude API. If a routed channel is missing or fails to start, work falls back to the host subagent for that role.</desc>
  <defs>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.045"/>
    </filter>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1.5 1.2 L7 4 L1.5 6.8" fill="none" stroke="#a3a29d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, 'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif; font-feature-settings: 'cv11', 'ss01'; }
    .t-ink { fill: #141414; }
    .t-sub { fill: #5a5955; }
    .t-faint { fill: #8a8984; }
    .wire { fill: none; stroke: #a3a29d; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
    .dash { stroke-dasharray: 3 4; }
    .ico { fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect x="0" y="0" width="1280" height="512" rx="24" fill="#f5f5f3"/>
<g><rect x="40" y="40" width="368" height="404" rx="20" fill="#ffffff" filter="url(#lift)"/><rect x="40.5" y="40.5" width="367" height="403" rx="19.5" fill="none" stroke="rgba(0,0,0,0.06)"/><text x="64" y="151" font-size="15" font-weight="600" letter-spacing="-0.01em" class="t-ink">Scout</text><text x="384" y="150.5" text-anchor="end" font-size="13" class="t-sub">Haiku high</text><line x1="64" y1="172.5" x2="384" y2="172.5" stroke="#ecebe8"/><text x="64" y="203" font-size="15" font-weight="600" letter-spacing="-0.01em" class="t-ink">Exec</text><text x="384" y="202.5" text-anchor="end" font-size="13" class="t-sub">Sonnet high</text><line x1="64" y1="224.5" x2="384" y2="224.5" stroke="#ecebe8"/><text x="64" y="255" font-size="15" font-weight="600" letter-spacing="-0.01em" class="t-ink">Core</text><text x="384" y="254.5" text-anchor="end" font-size="13" class="t-sub">Opus medium</text><line x1="64" y1="276.5" x2="384" y2="276.5" stroke="#ecebe8"/><text x="64" y="307" font-size="15" font-weight="600" letter-spacing="-0.01em" class="t-ink">Design</text><text x="384" y="306.5" text-anchor="end" font-size="13" class="t-sub">Opus medium</text><line x1="64" y1="328.5" x2="384" y2="328.5" stroke="#ecebe8"/><text x="64" y="359" font-size="15" font-weight="600" letter-spacing="-0.01em" class="t-ink">Review</text><text x="384" y="358.5" text-anchor="end" font-size="13" class="t-sub">Opus medium</text><line x1="64" y1="380.5" x2="384" y2="380.5" stroke="#ecebe8"/><text x="64" y="411" font-size="15" font-weight="600" letter-spacing="-0.01em" class="t-ink">Verify</text><text x="384" y="410.5" text-anchor="end" font-size="13" class="t-sub">Sonnet high</text><text x="64" y="78" font-size="16" font-weight="600" letter-spacing="-0.01em" class="t-ink">Host subagents</text><text x="64" y="100" font-size="12.5" class="t-sub">Any single agent is enough</text></g>
<g><rect x="872.5" y="40.5" width="367" height="403" rx="20" fill="none" stroke="rgba(0,0,0,0.16)" stroke-dasharray="4 4"/><text x="896" y="151" font-size="15" font-weight="600" letter-spacing="-0.01em" class="t-ink">Codex</text><text x="1216" y="150.5" text-anchor="end" font-size="13" class="t-sub">GPT Sol / Astra</text><line x1="896" y1="172.5" x2="1216" y2="172.5" stroke="rgba(0,0,0,0.07)"/><text x="896" y="203" font-size="15" font-weight="600" letter-spacing="-0.01em" class="t-ink">Grok</text><text x="1216" y="202.5" text-anchor="end" font-size="13" class="t-sub">Grok 4.7, research</text><line x1="896" y1="224.5" x2="1216" y2="224.5" stroke="rgba(0,0,0,0.07)"/><text x="896" y="255" font-size="15" font-weight="600" letter-spacing="-0.01em" class="t-ink">Gemini</text><text x="1216" y="254.5" text-anchor="end" font-size="13" class="t-sub">Neon, Hydrogen via agy</text><line x1="896" y1="276.5" x2="1216" y2="276.5" stroke="rgba(0,0,0,0.07)"/><text x="896" y="307" font-size="15" font-weight="600" letter-spacing="-0.01em" class="t-ink">Cursor</text><text x="1216" y="306.5" text-anchor="end" font-size="13" class="t-sub">Cursor agent</text><line x1="896" y1="328.5" x2="1216" y2="328.5" stroke="rgba(0,0,0,0.07)"/><text x="896" y="359" font-size="15" font-weight="600" letter-spacing="-0.01em" class="t-ink">Devin</text><line x1="896" y1="380.5" x2="1216" y2="380.5" stroke="rgba(0,0,0,0.07)"/><text x="896" y="411" font-size="15" font-weight="600" letter-spacing="-0.01em" class="t-ink">Claude API</text><text x="1216" y="410.5" text-anchor="end" font-size="13" class="t-sub">on request</text><text x="896" y="78" font-size="16" font-weight="600" letter-spacing="-0.01em" class="t-ink">External CLIs</text><text x="896" y="100" font-size="12.5" class="t-sub">Auto-detected if installed</text></g>
<g><rect x="522" y="201" width="236" height="150" rx="22" fill="#ffffff" filter="url(#lift)"/><rect x="522.5" y="201.5" width="235" height="149" rx="21.5" fill="none" stroke="rgba(0,0,0,0.06)"/><circle cx="640" cy="229" r="4" fill="#13a36b"/><text x="640" y="265" text-anchor="middle" class="t-ink" font-size="21" font-weight="700" letter-spacing="-0.02em">Coordinator</text><text x="640" y="289" text-anchor="middle" font-size="13" font-weight="600" fill="#13a36b">Opus medium</text><line x1="550" y1="305.5" x2="730" y2="305.5" stroke="#ecebe8"/><text x="640" y="329" text-anchor="middle" class="t-sub" font-size="12.5">plans, decides, owns Git</text></g>
<g><path class="wire" d="M518 276 H444"/><path class="wire" d="M444 156 V396"/><path class="wire" d="M444 156 Q444 146 434 146 H414" marker-end="url(#a)"/><path class="wire" d="M444 198 H414" marker-end="url(#a)"/><path class="wire" d="M444 250 H414" marker-end="url(#a)"/><path class="wire" d="M444 302 H414" marker-end="url(#a)"/><path class="wire" d="M444 354 H414" marker-end="url(#a)"/><path class="wire" d="M444 396 Q444 406 434 406 H414" marker-end="url(#a)"/><path class="wire dash" d="M762 276 H836"/><path class="wire dash" d="M836 156 V396"/><path class="wire dash" d="M836 156 Q836 146 846 146 H866" marker-end="url(#a)"/><path class="wire dash" d="M836 198 H866" marker-end="url(#a)"/><path class="wire dash" d="M836 250 H866" marker-end="url(#a)"/><path class="wire dash" d="M836 302 H866" marker-end="url(#a)"/><path class="wire dash" d="M836 354 H866" marker-end="url(#a)"/><path class="wire dash" d="M836 396 Q836 406 846 406 H866" marker-end="url(#a)"/></g>
<path class="wire dash" d="M1056 450 V468 Q1056 478 1046 478 H234 Q224 478 224 468 V450" marker-end="url(#a)"/><rect x="368" y="466" width="544" height="24" fill="#f5f5f3"/><text x="640" y="482.5" text-anchor="middle" font-size="12.5" class="t-sub">Missing or fails to start: falls back to the host subagent for that role</text>
</svg>
