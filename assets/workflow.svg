<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="423" viewBox="0 0 1280 423" role="img" aria-labelledby="t d">
  <title id="t">BeanStack workflow</title>
  <desc id="d">Align, Explore, Propose, Red test, Dispatch, Verify, Deliver, Freeze and PR, then Ship: Merge, Release and Deploy, each needing explicit authorization. Failed verification and user acceptance feedback both loop back to Dispatch.</desc>
  <defs>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.045"/>
    </filter>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1.5 1.2 L7 4 L1.5 6.8" fill="none" stroke="#a3a29d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, 'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif; font-feature-settings: 'cv11', 'ss01'; }
    .t-ink { fill: #141414; }
    .t-sub { fill: #5a5955; }
    .t-faint { fill: #8a8984; }
    .wire { fill: none; stroke: #a3a29d; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
    .dash { stroke-dasharray: 3 4; }
    .ico { fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect x="0" y="0" width="1280" height="423" rx="24" fill="#f5f5f3"/>
<path class="wire" d="M168 76 H216" marker-end="url(#a)"/><path class="wire" d="M296 76 H344" marker-end="url(#a)"/><path class="wire" d="M424 76 H472" marker-end="url(#a)"/><path class="wire" d="M552 76 H600" marker-end="url(#a)"/><path class="wire" d="M680 76 H728" marker-end="url(#a)"/><path class="wire" d="M808 76 H856" marker-end="url(#a)"/><path class="wire" d="M936 76 H984" marker-end="url(#a)"/><path class="wire" d="M1064 76 H1112" marker-end="url(#a)"/>
<g><rect x="100" y="48" width="56" height="56" rx="16" fill="#ffffff" filter="url(#lift)"/><rect x="100.5" y="48.5" width="55" height="55" rx="15.5" fill="none" stroke="rgba(0,0,0,0.06)"/><g class="ico" stroke="#141414" color="#141414" transform="translate(116 64) scale(1)"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.25"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/></g><text x="128" y="134" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="-0.01em" fill="#141414">Align</text><text x="128" y="158" text-anchor="middle" class="t-sub" font-size="12.5"><tspan x="128" dy="0">Restate goal</tspan><tspan x="128" dy="17">and scope</tspan></text></g>
<g><rect x="228" y="48" width="56" height="56" rx="16" fill="#ffffff" filter="url(#lift)"/><rect x="228.5" y="48.5" width="55" height="55" rx="15.5" fill="none" stroke="rgba(0,0,0,0.06)"/><g class="ico" stroke="#141414" color="#141414" transform="translate(244 64) scale(1)"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></g><text x="256" y="134" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="-0.01em" fill="#141414">Explore</text><text x="256" y="158" text-anchor="middle" class="t-sub" font-size="12.5"><tspan x="256" dy="0">Scout code</tspan><tspan x="256" dy="17">and docs</tspan></text></g>
<g><rect x="356" y="48" width="56" height="56" rx="16" fill="#ffffff" filter="url(#lift)"/><rect x="356.5" y="48.5" width="55" height="55" rx="15.5" fill="none" stroke="rgba(0,0,0,0.06)"/><g class="ico" stroke="#141414" color="#141414" transform="translate(372 64) scale(1)"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h4"/></g><text x="384" y="134" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="-0.01em" fill="#141414">Propose</text><text x="384" y="158" text-anchor="middle" class="t-sub" font-size="12.5"><tspan x="384" dy="0">OpenSpec or</tspan><tspan x="384" dy="17">short plan</tspan></text></g>
<g><rect x="484" y="48" width="56" height="56" rx="16" fill="#ffffff" filter="url(#lift)"/><rect x="484.5" y="48.5" width="55" height="55" rx="15.5" fill="none" stroke="rgba(0,0,0,0.06)"/><g class="ico" stroke="#d0453a" color="#d0453a" transform="translate(500 64) scale(1)"><path d="M9 3h6"/><path d="M10 3v6l-5 9.2A1.9 1.9 0 0 0 6.7 21h10.6a1.9 1.9 0 0 0 1.7-2.8L14 9V3"/><path d="M7.4 15h9.2"/></g><text x="512" y="134" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="-0.01em" fill="#d0453a">Red test</text><text x="512" y="158" text-anchor="middle" class="t-sub" font-size="12.5"><tspan x="512" dy="0">Fails first,</tspan><tspan x="512" dy="17">own commit</tspan></text></g>
<g><rect x="612" y="48" width="56" height="56" rx="16" fill="#ffffff" filter="url(#lift)"/><rect x="612.5" y="48.5" width="55" height="55" rx="15.5" fill="none" stroke="rgba(0,0,0,0.06)"/><g class="ico" stroke="#141414" color="#141414" transform="translate(628 64) scale(1)"><circle cx="5" cy="12" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="19" cy="19" r="2"/><path d="M7 12h10"/><path d="M7 11c5 0 5-6 10-6"/><path d="M7 13c5 0 5 6 10 6"/></g><text x="640" y="134" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="-0.01em" fill="#141414">Dispatch</text><text x="640" y="158" text-anchor="middle" class="t-sub" font-size="12.5"><tspan x="640" dy="0">Subagents</tspan><tspan x="640" dy="17">implement</tspan></text></g>
<g><rect x="740" y="48" width="56" height="56" rx="16" fill="#ffffff" filter="url(#lift)"/><rect x="740.5" y="48.5" width="55" height="55" rx="15.5" fill="none" stroke="rgba(0,0,0,0.06)"/><g class="ico" stroke="#141414" color="#141414" transform="translate(756 64) scale(1)"><circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.4l2.6 2.6 5-5.4"/></g><text x="768" y="134" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="-0.01em" fill="#141414">Verify</text><text x="768" y="158" text-anchor="middle" class="t-sub" font-size="12.5"><tspan x="768" dy="0">Walk the</tspan><tspan x="768" dy="17">user path</tspan></text></g>
<g><rect x="868" y="48" width="56" height="56" rx="16" fill="#ffffff" filter="url(#lift)"/><rect x="868.5" y="48.5" width="55" height="55" rx="15.5" fill="none" stroke="rgba(0,0,0,0.06)"/><g class="ico" stroke="#141414" color="#141414" transform="translate(884 64) scale(1)"><path d="M4 7.8L12 4l8 3.8v8.4L12 20l-8-3.8z"/><path d="M4 7.8l8 3.9 8-3.9"/><path d="M12 11.7V20"/></g><text x="896" y="134" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="-0.01em" fill="#141414">Deliver</text><text x="896" y="158" text-anchor="middle" class="t-sub" font-size="12.5"><tspan x="896" dy="0">Before / after</tspan><tspan x="896" dy="17">table</tspan></text></g>
<g><rect x="996" y="48" width="56" height="56" rx="16" fill="#ffffff" filter="url(#lift)"/><rect x="996.5" y="48.5" width="55" height="55" rx="15.5" fill="none" stroke="rgba(0,0,0,0.06)"/><g class="ico" stroke="#141414" color="#141414" transform="translate(1012 64) scale(1)"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><path d="M6 8v8"/><path d="M18 16v-6a3 3 0 0 0-3-3h-4"/><path d="M13 5l-2 2 2 2"/></g><text x="1024" y="134" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="-0.01em" fill="#141414">Freeze &amp; PR</text><text x="1024" y="158" text-anchor="middle" class="t-sub" font-size="12.5"><tspan x="1024" dy="0">Sync main,</tspan><tspan x="1024" dy="17">review, PR</tspan></text></g>
<g><rect x="1124" y="48" width="56" height="56" rx="16" fill="#ffffff" filter="url(#lift)"/><rect x="1124.5" y="48.5" width="55" height="55" rx="15.5" fill="none" stroke="rgba(0,0,0,0.06)"/><g class="ico" stroke="#b7791f" color="#b7791f" transform="translate(1140 64) scale(1)"><rect x="5" y="10.5" width="14" height="10" rx="2.2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><path d="M12 14.6v2"/></g><text x="1152" y="134" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="-0.01em" fill="#b7791f">Ship</text><text x="1152" y="158" text-anchor="middle" class="t-sub" font-size="12.5"><tspan x="1152" dy="0">Merge, release,</tspan><tspan x="1152" dy="17">deploy</tspan></text></g>
<path class="wire dash" d="M768 197 V217 Q768 227 758 227 H640"/><path class="wire dash" d="M896 197 V243 Q896 253 886 253 H650 Q640 253 640 243 V199" marker-end="url(#a)"/><text x="626" y="231.5" text-anchor="end" font-size="12.5" font-weight="500" class="t-ink">verification fails</text><text x="626" y="257.5" text-anchor="end" font-size="12.5" font-weight="500" class="t-ink">user acceptance feedback</text>
<path class="wire" d="M1152 197 V273" marker-end="url(#a)"/>
<g><rect x="704" y="279" width="512" height="104" rx="18" fill="#ffffff" filter="url(#lift)"/><rect x="704.5" y="279.5" width="511" height="103" rx="17.5" fill="none" stroke="rgba(0,0,0,0.06)"/><text x="728" y="309" font-size="13" font-weight="600" fill="#b7791f">Each needs explicit authorization</text><line x1="728" y1="323.5" x2="1192" y2="323.5" stroke="#ecebe8"/><g class="ico" stroke="#b7791f" color="#b7791f" transform="translate(728 336.5) scale(0.6666666666666666)"><rect x="5" y="10.5" width="14" height="10" rx="2.2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><path d="M12 14.6v2"/></g><text x="754" y="349" font-size="13.5" font-weight="600" class="t-ink">Merge</text><text x="754" y="367" font-size="12.5" class="t-sub">into main</text><g class="ico" stroke="#b7791f" color="#b7791f" transform="translate(882.6666666666666 336.5) scale(0.6666666666666666)"><rect x="5" y="10.5" width="14" height="10" rx="2.2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><path d="M12 14.6v2"/></g><text x="908.6666666666666" y="349" font-size="13.5" font-weight="600" class="t-ink">Release</text><text x="908.6666666666666" y="367" font-size="12.5" class="t-sub">version tag</text><g class="ico" stroke="#b7791f" color="#b7791f" transform="translate(1037.3333333333333 336.5) scale(0.6666666666666666)"><rect x="5" y="10.5" width="14" height="10" rx="2.2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><path d="M12 14.6v2"/></g><text x="1063.3333333333333" y="349" font-size="13.5" font-weight="600" class="t-ink">Deploy</text><text x="1063.3333333333333" y="367" font-size="12.5" class="t-sub">production</text></g>
<g font-size="12.5" class="t-sub"><path class="wire" d="M64 313 H96" marker-end="url(#a)"/><text x="108" y="317">main flow</text><path class="wire dash" d="M64 339 H96" marker-end="url(#a)"/><text x="108" y="343">back to Dispatch</text><g class="ico" stroke="#b7791f" color="#b7791f" transform="translate(73 358) scale(0.5833333333333334)"><rect x="5" y="10.5" width="14" height="10" rx="2.2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><path d="M12 14.6v2"/></g><text x="108" y="369">human sign-off</text></g>
</svg>
