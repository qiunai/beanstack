    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.045"/>
    </filter>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1.5 1.2 L7 4 L1.5 6.8" fill="none" stroke="#a3a29d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, 'Inter Tight', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', system-ui, -apple-system, 'Segoe UI', sans-serif; font-feature-settings: 'cv11', 'ss01'; }
    .t-ink { fill: #141414; }
    .t-sub { fill: #5a5955; }
    .t-faint { fill: #8a8984; }
    .wire { fill: none; stroke: #a3a29d; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
    .dash { stroke-dasharray: 3 4; }
    .ico { fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  </style>
