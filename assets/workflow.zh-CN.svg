<g><rect x="868" y="48" width="56" height="56" rx="16" fill="#ffffff" filter="url(#lift)"/><rect x="868.5" y="48.5" width="55" height="55" rx="15.5" fill="none" stroke="rgba(0,0,0,0.06)"/><g class="ico" stroke="#141414" color="#141414" transform="translate(884 64) scale(1)"><path d="M4 7.8L12 4l8 3.8v8.4L12 20l-8-3.8z"/><path d="M4 7.8l8 3.9 8-3.9"/><path d="M12 11.7V20"/></g><text x="896" y="134" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="0" fill="#141414">交付</text><text x="896" y="158" text-anchor="middle" class="t-sub" font-size="12.5"><tspan x="896" dy="0">改前改后</tspan><tspan x="896" dy="17">对照表</tspan></text></g>
