<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="423" viewBox="0 0 1280 423" role="img" aria-labelledby="t d" xml:lang="zh-CN">
  <title id="t">BeanStack 工作流</title>
  <desc id="d">对齐、调研、提案、先写红测试、派工、验证、交付、冻结与 PR，最后上线：合并、发版、部署各自需要用户明确授权。验证不通过和用户验收反馈都回到派工。</desc>
